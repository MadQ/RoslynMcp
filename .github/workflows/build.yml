name: Build and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  # pull_request_target runs in the trusted base-branch context and does not
  # require manual "Approve and run" from maintainers for bot/Copilot PRs.
  # pull_request still runs for human contributor PRs on the same repo.
  pull_request_target:
    branches: [ main, dev ]

# Minimal token permissions — this workflow only reads source and builds.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['8.0.x', '10.0.x']

    steps:
    - uses: actions/checkout@v4
      with:
        # For pull_request_target the default checkout is the base branch, not the
        # PR's head — explicitly check out the contributor's commit so we build
        # the actual proposed changes rather than the unchanged base.
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore src/RoslynMcp/RoslynMcp.csproj

    - name: Build
      run: dotnet build src/RoslynMcp/RoslynMcp.csproj --no-restore --configuration Release

    #- name: Run tests
    #  run: dotnet run --project src/TestHarness/TestHarness.csproj --no-build
