name: Build and Test
permissions:
  contents: read

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # ContinuousIntegrationBuild is enabled in CI via Directory.Build.props
    # (gated on GITHUB_ACTIONS, which the runner sets) — no per-workflow env needed here.
    # RestoreLockedMode is intentionally NOT used here: SDK 10.0.302+ includes a machine
    # RID and an SDK-versioned ILLink.Tasks entry in the restore graph, making the lock file
    # inherently platform-specific. --force-evaluate regenerates the lock file per platform
    # so restore always succeeds, which is NuGet's own recommended workaround (NU1004).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['10.0.x']

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore src/RoslynMcp/RoslynMcp.csproj --force-evaluate

    - name: Build
      run: dotnet build src/RoslynMcp/RoslynMcp.csproj --no-restore --configuration Release

    #- name: Run tests
    #  run: dotnet run --project src/TestHarness/TestHarness.csproj --no-build
