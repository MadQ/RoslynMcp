name: Build and Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['8.0.x', '10.0.x']

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore RoslynMcp/RoslynMcp.csproj

    - name: Build
      run: dotnet build RoslynMcp/RoslynMcp.csproj --no-restore --configuration Release

    - name: Run tests
      run: dotnet run --project TestHarness/TestHarness.csproj --no-build
