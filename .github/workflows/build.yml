name: Build and Test
permissions:
  contents: read

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # ContinuousIntegrationBuild is enabled in CI via Directory.Build.props
    # (gated on GITHUB_ACTIONS, which the runner sets) — no per-workflow env needed here.
    # RestoreLockedMode is set to true in Directory.Build.props but is overridden by
    # --force-evaluate below: SDK 10.0.302+ adds the machine RID and an SDK-versioned
    # ILLink.Tasks to the restore graph, making a single cross-platform lock file
    # incompatible with RestoreLockedMode. --force-evaluate is NuGet's recommended fix (NU1004).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ['10.0.x']

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore src/RoslynMcp/RoslynMcp.csproj --force-evaluate

    - name: Build
      run: dotnet build src/RoslynMcp/RoslynMcp.csproj --no-restore --configuration Release

    #- name: Run tests
    #  run: dotnet run --project src/TestHarness/TestHarness.csproj --no-build
