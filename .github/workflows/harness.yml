name: Test Harness
permissions:
  contents: read

# The TestHarness, in full. It is the release gate: publish.yml calls this workflow and will not
# publish unless it passes on all three operating systems (#330). It also runs on pull requests, on
# Windows and Linux (#367), so a local run may be filtered to the groups a change touches
# (--only / --test): every pull request still gets the whole suite here. macOS is left out of pull
# requests because its runners queue for up to an hour; it runs at publish and by hand.
on:
  # Called by publish.yml.
  workflow_call:

  # Run by hand, on any branch: Actions -> Test Harness -> Run workflow.
  workflow_dispatch:

  # Every pull request, docs-only ones included: a workflow skipped by a path filter reports no
  # status at all, so if this check is ever made required, a docs-only pull request would wait for
  # it forever. Trivial doc fixes go straight to dev anyway (AGENTS.md).
  pull_request:
    branches: [ main, dev ]

# A new push to a pull request supersedes the run still going for the previous one.
concurrency:
  group: harness-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    name: Harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # One operating system failing must not hide the result of the others.
      fail-fast: false
      # Called through workflow_call, event_name is the caller's: publish.yml runs on
      # workflow_dispatch only, so the release gate keeps all three. Giving publish.yml a
      # pull_request trigger would drop macOS from the gate.
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["windows-latest", "ubuntu-latest"]') || fromJSON('["windows-latest", "ubuntu-latest", "macos-latest"]') }}

    # A full run takes a few minutes. The limit only stops a hung run from holding a runner.
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.302'

    # --quiet: one line per failing test, the server's stderr after them, and one summary line.
    # The exit code fails the job.
    - name: Run the TestHarness
      run: dotnet run --project src/TestHarness/TestHarness.csproj -f net10.0 -- --quiet
