name: Publish NuGet Package
permissions:
  id-token: write   # required for NuGet.org Trusted Publishing (OIDC token exchange)
  contents: read

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build, OIDC login and pack, but do NOT push to NuGet. Validates the Trusted Publishing policy without publishing.'
        type: boolean
        default: true

jobs:
  publish:
    # Gated on the `release` GitHub environment — this name must match exactly the
    # environment registered in the NuGet.org Trusted Publishing policy. Add a
    # required-reviewer protection rule to this environment (repo Settings →
    # Environments → release) for a manual approval gate before any OIDC token is minted.
    environment: release
    # Windows runner for MSBuild/Roslyn compatibility — BuildHost discovery
    # requires loose files on disk, which is handled by ExcludeBuildHostFromSingleFile
    # and the Pack configuration's PublishSingleFile=false.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/RoslynMcp/RoslynMcp.csproj

      # -c Pack activates PackAsTool=true + ToolCommandName=madq-roslynmcp
      # (PackageId MadQ.RoslynMcp) in the csproj. PublishSingleFile is suppressed in
      # Pack configuration so tool assemblies remain as loose files — required by
      # BuildHost process resolution at runtime.
      - name: Pack
        run: dotnet pack src/RoslynMcp/RoslynMcp.csproj -c Pack --no-restore -o artifacts/

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived NuGet API
      # key — no long-lived NUGET_API_KEY secret required. `user` must be the NuGet.org
      # account username tied to the Trusted Publishing policy. This step succeeding is
      # itself the proof that the policy (repo + workflow + environment) is configured
      # correctly, so a dry run still runs it.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: MadQ   # <-- NuGet.org account username; update if it differs

      # Always surface the built package as an artifact so it can be inspected without
      # publishing — the primary payoff of a dry run.
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

      # PowerShell (the default shell on windows-latest) does not expand the
      # artifacts/*.nupkg wildcard for native commands, and dotnet nuget push treats the
      # literal pattern as a filename ("File does not exist"). Resolve the real path
      # first — the upload-artifact step above already proved a .nupkg exists.
      - name: Push to NuGet
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          $pkg = Get-ChildItem artifacts/*.nupkg | Select-Object -First 1
          if(-not $pkg) { throw "No .nupkg found in artifacts/" }
          Write-Host "Pushing $($pkg.Name)"
          dotnet nuget push $pkg.FullName --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Dry run — push skipped
        if: ${{ inputs.dry_run }}
        run: |
          Write-Host "DRY RUN: package built and OIDC login succeeded — push skipped. Download the 'nupkg' artifact to inspect. Re-run with dry_run=false to publish."
