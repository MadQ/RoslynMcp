name: Publish NuGet Package
permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    # Windows runner for MSBuild/Roslyn compatibility — BuildHost discovery
    # requires loose files on disk, which is handled by ExcludeBuildHostFromSingleFile
    # and the Pack configuration's PublishSingleFile=false.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/RoslynMcp/RoslynMcp.csproj

      # -c Pack activates PackAsTool=true + ToolCommandName=roslynmcp in the csproj.
      # PublishSingleFile is suppressed in Pack configuration so tool assemblies
      # remain as loose files — required by BuildHost process resolution at runtime.
      - name: Pack
        run: dotnet pack src/RoslynMcp/RoslynMcp.csproj -c Pack --no-restore -o artifacts/

      - name: Push to NuGet
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
